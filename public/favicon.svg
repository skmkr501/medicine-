<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0FDFA" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="sbShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#042f2e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#sbGradient)" />

  <!-- Protective Heart Shield Contour (Pure White & Mint) -->
  <path d="M32 14 C39 7, 52 10, 52 23 C52 35, 38 45, 32 50 C26 45, 12 35, 12 23 C12 10, 25 7, 32 14 Z" 
        fill="none" 
        stroke="rgba(255, 255, 255, 0.25)" 
        stroke-width="3" 
        stroke-linecap="round" />

  <!-- Angled Medicine Capsule Icon -->
  <g transform="translate(32, 31) rotate(-40)" filter="url(#sbShadow)">
    <!-- Pill Top Half (White) -->
    <path d="M-7,-13 C-7,-18 7,-18 7,-13 L7,0 L-7,0 Z" fill="url(#pillGrad)" />
    <!-- Pill Bottom Half (Vibrant Mint Teal) -->
    <path d="M-7,0 L7,0 L7,13 C7,18 -7,18 -7,13 Z" fill="url(#accentGrad)" />
    <!-- Center Dividing Line -->
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#0F766E" stroke-width="1.2" />
    <!-- Subtle shine -->
    <ellipse cx="-2.5" cy="-7" rx="1.5" ry="3" fill="rgba(255,255,255,0.7)" transform="rotate(-15 -2.5 -7)" />
  </g>

  <!-- Gentle Pulse / Care Spark in Heart Center -->
  <circle cx="44" cy="20" r="3" fill="#FACC15" />
  <path d="M44 15 L44 25 M39 20 L49 20" stroke="#FACC15" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
</svg>
